<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="header-container">
        <div class="site-branding">
          <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
          {% if site.description %}
            <span class="site-description">{{ site.description }}</span>
          {% endif %}
        </div>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}class="active" aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/skins/' | relative_url }}" {% if page.url contains '/skins' %}class="active" aria-current="page"{% endif %}>Skins Registry</a>
          <a href="{{ '/resources' | relative_url }}" {% if page.url contains '/resources' %}class="active" aria-current="page"{% endif %}>Resources</a>
          <a href="https://github.com/HoopyFrood42/HoopyFrood42.github.io" target="_blank" rel="noopener" class="nav-ext">GitHub ↗</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <div class="content-container">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <p class="footer-meta">
          &copy; {{ 'now' | date: "%Y" }} {{ site.title }} &mdash; Free custom skins & assets for AO3.
        </p>
        <p class="footer-sublinks">
          <a href="{{ '/' | relative_url }}">Home</a> &bull;
          <a href="{{ '/skins/' | relative_url }}">Registry</a> &bull;
          <a href="{{ '/registry.json' | relative_url }}">registry.json</a> &bull;
          <a href="#top">Back to top ↑</a>
        </p>
      </div>
    </footer>

    <!-- Active Navigation Highlight Script -->
    <script>
      (function() {
        const path = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
        document.querySelectorAll('.site-nav a:not(.nav-ext)').forEach(link => {
          const href = link.getAttribute('href').replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
          if ((href === '/' && path === '/') || (href !== '/' && path.startsWith(href))) {
            link.classList.add('active');
            link.setAttribute('aria-current', 'page');
          } else {
            link.classList.remove('active');
            link.removeAttribute('aria-current');
          }
        });
      })();
    </script>
  </body>
</html>
